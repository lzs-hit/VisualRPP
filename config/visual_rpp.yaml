bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    use_sim_time: false
    controller_plugins: ["VisualRPP"]
    goal_checker_plugins: ["goal_checker","precise_goal_checker"]
    VisualRPP:
      plugin: "visual_avoidance_controller::VisualAvoidanceController"
      # ===== RPP基础参数（来自rpp.yaml）=====
      desired_linear_vel: 0.6
      lookahead_dist: 0.4
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      rotate_to_heading_angular_vel: 0.0
      use_rotate_to_heading: false
      allow_reversing: false
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      regulate_linear_velocity_scaling: false
      regulate_linear_velocity_scaling_min_radius: 0.8
      regulate_linear_velocity_scaling_min_speed: 0.5
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.0
      # ===== 视觉避障专属参数 =====
      obstacle_topic: "/obstacle_info"
      cone_zone_a: 75.0
      cone_zone_b: 20.0
      cone_zone_c: 25.0
      avoid_R: 0.35
      avoid_bigR: 0.45
      near_threshold_distance: 0.6
      y_threshold: 1.2
      offset_x_first_half: 0.0
      offset_x_second_half: 0.0
      half_transition_distance: 3.0
      recovery_duration: 1.2
      avoid_linear_vel: 0.4
      max_angular_vel: 1.0
      avoidance_steering_gain: 2.0
      path_bias_weight: 0.6
      avoidance_cooldown_duration: 0.1
      recovery_speed_ratio: 0.5
      enable_visual_avoidance: true

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 6.28
      stateful: True
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.01
      stateful: True


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 12.0
      publish_frequency: 12.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: false
      footprint: "[ [0.260, 0.180], [0.260, -0.180], [-0.210, -0.180], [-0.210, 0.180] ]"
      resolution: 0.05
      track_unknown_space: true
      use_maximum: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer",
          "keepout_filter_layer"] #"exclusion_clear_layer_1", "exclusion_clear_layer_2"

      # 0. 静态层
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 1. 障碍物层
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        static_map_clearance: 3
        ignored_bounding_boxes: [-0.5,3.2,0.0,4.5,  3.6, 3.2, 4.5, 4.5]
        observation_sources: scan
        scan:
          topic: "/scan_deskewed_pc"
          sensor_frame: "odom"
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -0.15
          max_obstacle_height: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.25
          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          observation_persistence: 0.20

      # 2. 膨胀层
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflate_unknown: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.50

      # 3. 堵门口
      exclusion_clear_layer_1:
        plugin: "nav_pkg::ExclusionClearLayer"
        enabled: true
        min_x: -1.0
        min_y: -0.5
        max_x: 1.0
        max_y: -0.15
      exclusion_clear_layer_2:
        plugin: "nav_pkg::ExclusionClearLayer"
        enabled: true
        min_x: -1.0
        min_y: -0.7
        max_x: 3.0
        max_y: -0.41
      # 4. Keepout 过滤层
      keepout_filter_layer:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"

      always_send_full_costmap: True
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: "map"
      robot_base_frame: "base_link"
      use_sim_time: false
      footprint: "[ [0.260, 0.180], [0.260, -0.180], [-0.210, -0.180], [-0.210, 0.180] ]"
      resolution: 0.05
      track_unknown_space: true
      use_maximum: true
      # 透传层 + inflation元数据: inflation_radius=0 零计算, 仅提供footprint优化
      plugins: ["inflation_layer", "passthrough_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: False                # 禁用计算, 仅提供元数据给planner
        inflation_radius: 0.20        # ≥inscribed_radius(0.14), 消除警告
        cost_scaling_factor: 10.0
        inflate_unknown: false

      passthrough_layer:
        plugin: "nav_pkg::PassthroughLayer"
        enabled: True
        map_topic: "/local_costmap/costmap_raw"

      always_send_full_costmap: True
map_server:
  ros__parameters:
    use_sim_time: false
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      # # # ══════════════════════════════════════════════════════════════
      # # # 原 SmacPlannerHybrid (REEDS_SHEPP) — 已禁用
      # # # ══════════════════════════════════════════════════════════════
      # plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # debug_visualizations: true
      # tolerance: 2.0
      # allow_unknown: true
      # max_iterations: -1
      # max_planning_time: 3.5
      # lookup_table_size: 5.0
      # motion_model_for_search: "REEDS_SHEPP"
      # angle_quantization_bins: 48
      # minimum_turning_radius: 0.25
      # analytic_expansion_ratio: 8.0
      # cost_penalty: 4.0
      # reverse_penalty: 4.0
      # downsample_costmap: false
      # downsampling_factor: 2
      # smooth_path: true
      # smoother:
      #   max_iterations: 500
      #   w_smooth: 0.25
      #   w_data: 0.3
      #   tolerance: 1.0e-10
      #   do_refinement: true

      # ══════════════════════════════════════════════════════════════
      #  SmacPlanner2D 
      # ══════════════════════════════════════════════════════════════
      plugin: "nav_pkg::PathStitchingPlanner"
      # --- Path retention parameters ---
      look_ahead_distance: 2.0
      max_deviation: 0.3
      min_path_similarity: 0.3
      similarity_check_enabled: false
      start_relax_distance: 0.5
      inner_planner: "nav2_smac_planner/SmacPlanner2D"
      # bootstrap_distance: 0.10  # not used by PathStitchingPlanner
      # tolerance: 0.7  # 原值
      tolerance: 1.0  # 放宽，MPPI接管最终逼近
      downsample_costmap: true
      downsampling_factor: 3
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 3.5
      cost_travel_multiplier: 3.0  # 允许路径适度穿过轻度膨胀区
      smooth_path: true
      smoother:
        max_iterations: 500
        # w_smooth: 0.1  # 原值，几乎不平滑
        w_smooth: 0.25  # 拉直锯齿，减少Ackermann无法执行的锐角
        # w_data: 1.0  # 原值，路径被死死锚定在原位
        w_data: 0.3  # 让平滑器有权移动路径点
        tolerance: 1.0e-10
        do_refinement: true

  # planner_server:
  #   ros__parameters:
  #     expected_planner_frequency: 20.0
  #     use_sim_time: false
  #     planner_plugins: ["GridBased"]
