smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["fliter_smoother"]
    fliter_smoother:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      
      reversing_enabled: false
      keep_start_orientation: true  # 保持起始点朝向不被平滑变动（推荐开启，保证机器人起步方向准确）
      keep_goal_orientation: true   # 保持目标点朝向不被平滑变动（推荐开启，保证最终精准对准目标）
      
      # --- 最小转弯半径约束 ---
      minimum_turning_radius: 0.25  # 机器人最小转弯半径（单位：米）。如果是全向轮/差速轮可以设为 0.0，阿克曼结构必须严格设置
      w_curve: 30.0
      
      # --- 路径平滑度与轨迹保持权重 ---
      w_smooth: 2000000.0
      w_dist: 10.0
      w_cost: 20.0
      
      # --- 采样优化（性能调优关键） ---
      path_downsampling_factor: 3   # 下采样因子。每隔 n 个路径点取一个进行优化。数值越大优化越快，但可能丢失细节（推荐 2~3）
      path_upsampling_factor: 1     # 上采样因子。0: 保持下采样点；1: 优化后用三次贝塞尔曲线恢复到原路径点的精细度（推荐设为 1）
      
      # --- 倒车切换点（Cusp）特殊优化 ---
      # 机器人就地旋转或前后切换时最容易擦墙，通过下面两个参数在切换点附近加大避障权重
      w_cost_cusp_multiplier: 3.0   # 拐点区域的避障权重放大倍数
      cusp_zone_length: 2.5         # 拐点影响区域的长度（米）。在这个范围内，避障权重会向着拐点渐进放大
      
      # --- 优化求解器设置（Ceres Solver） ---
      optimizer:
        max_iterations: 70            # 最大迭代次数。次数越多越平滑，但越消耗 CPU。通常 50~100 之间
        debug_optimizer: false        # 是否打印优化器的调试信息（如非必要请保持 false，否则日志刷屏）
        gradient_tol: 5000.0
        fn_tol: 1.0e-15
        param_tol: 1.0e-20            # 参数变化量收敛容差

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 10.0]
    min_velocity: [-1.25, 0.0, -10.0]
    max_accel: [5.0, 0.0, 6.28]
    max_decel: [-2.5, 0.0, -6.28]
    odom_topic: "/odom"
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

reloc_node:
  ros__parameters:
    publish_mode: "initialpose"              # "tf" = 直接发map→odom TF; "initialpose" = 发 /initialpose 给 AMCL
    global_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    xy_search_radius: 0.5              # 位置搜索半径 (m)
    yaw_search_angle: 50.0              # 角度搜索范围 (±度)
    yaw_search_step: 0.5               # 角度搜索步长 (度)
    expected_x: 0.0                     # 期望初始位置 x (m)
    expected_y: 0.0                     # 期望初始位置 y (m)
    expected_yaw: 0.0                   # 期望初始朝向 (度), 搜索以它为中心
    match_score_threshold: 0.15         # 最低匹配置信度
    template_radius: 1.0                     # 扫描模板半径 (m)，对应 200px@0.05 分辨率
    init_cov_x: 0.01                    # 初始位姿 x 方差
    init_cov_y: 0.01                    # 初始位姿 y 方差
    init_cov_yaw: 0.02                  # 初始位姿 yaw 方差 (≈8°)
